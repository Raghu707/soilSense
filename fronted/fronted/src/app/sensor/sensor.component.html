<div class="main">

  <!-- ✅ HEADER -->
  <div class="top-bar">
    <div>
      <h2>📡 Sensors</h2>
      <p class="subtitle">Manage all connected sensor devices</p>
    </div>

    <button class="add-btn" (click)="openModal()">
      + Add Sensor
    </button>
  </div>

  <!-- ✅ TABLE CARD -->
  <div class="table-container">

    <table>
      <thead>
        <tr>
          <th>Device ID</th>
          <th>Material</th>
          <th>Metal</th>
          <th>Battery</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of sensors">

          <td class="device">{{ s.deviceId }}</td>

          <td>{{ s.materialDescription }}</td>

          <td>{{ s.metalDescription }}</td>

          <!-- ✅ BATTERY BAR -->
          <td>
            <div class="battery">
              <div 
                class="level"
                [ngStyle]="{ width: (s.battery || 0) + '%' }"
              ></div>
            </div>
            <span class="battery-text">{{ s.battery || '-' }}%</span>
          </td>

          <td>
            <button class="delete-btn" (click)="deleteSensor(s._id)">
              🗑 Delete
            </button>
          </td>

        </tr>

        <!-- ✅ EMPTY STATE -->
        <tr *ngIf="sensors.length === 0">
          <td colspan="5" class="no-data">
            No sensors available
          </td>
        </tr>

      </tbody>
    </table>

  </div>
</div>


<!-- ✅ MODAL -->
<div class="modal" *ngIf="showModal">

  <div class="modal-box">

    <h3>➕ Add New Sensor</h3>

    <div class="form">

      <input
        [(ngModel)]="newSensor.deviceId"
        placeholder="Device ID (e.g. SENSOR_001)"
      />

      <input
        [(ngModel)]="newSensor.metalDescription"
        placeholder="Metal Description"
      />

      <input
        [(ngModel)]="newSensor.materialDescription"
        placeholder="Material Description"
      />

    </div>

    <div class="actions">
      <button class="save" (click)="createSensor()">✅ Save</button>
      <button class="cancel" (click)="closeModal()">Cancel</button>
    </div>

  </div>

</div>
