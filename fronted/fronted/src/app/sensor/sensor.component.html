<div class="main">

  <div class="top-bar">
    <h2>Sensors</h2>
    <button class="add-btn" (click)="openModal()">+ Add Sensor</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Device ID</th>
        <th>Material</th>
        <th>Metal</th>
        <th>Temperature</th>
        <th>Humidity</th>
        <th>Battery</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let s of sensors">

        <td>{{ s.deviceId }}</td>

        <td>{{ s.materialDescription }}</td>

        <td>{{ s.metalDescription }}</td>

        <td>{{ s.temperature || '-' }}</td>

        <td>{{ s.humidity || '-' }}</td>

        <td>{{ s.battery || '-' }}</td>

        <td>
          <button (click)="deleteSensor(s._id)">Delete</button>
        </td>

      </tr>
    </tbody>
  </table>
</div>
<div class="modal" *ngIf="showModal">

  <div class="modal-box">

    <h3>Add Sensor</h3>

    <div class="form">

      <input
        [(ngModel)]="newSensor.deviceId"
        placeholder="Device ID (e.g. SENSOR_001)"
      />

      <input
        [(ngModel)]="newSensor.metalDescription"
        placeholder="Metal Description"
      />

      <input
        [(ngModel)]="newSensor.materialDescription"
        placeholder="Material Description"
      />

    </div>

    <div class="actions">
      <button class="save" (click)="createSensor()">Save</button>
      <button class="cancel" (click)="closeModal()">Cancel</button>
    </div>

  </div>

</div>
