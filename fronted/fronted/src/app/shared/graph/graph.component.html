<div class="page">

  <!-- ✅ TITLE -->
  <h2>Sensor Data</h2>
  <p class="subtitle">Your sensor data over time</p>

  <!-- ✅ MOISTURE -->
  <div class="card">
    
    <div class="card-header">
      <h3>Moisture over time</h3>

      <div class="range">
        <span>24h</span>
        <span class="active">7d</span>
        <span>1m</span>
      </div>
    </div>

    <canvas id="moistureChart"></canvas>

  </div>

  <!-- ✅ TEMPERATURE -->
  <div class="card">

    <div class="card-header">
      <h3>Temperature over time</h3>

      <div class="range">
        <span>24h</span>
        <span class="active">7d</span>
        <span>1m</span>
      </div>
    </div>

    <canvas id="tempChart"></canvas>

  </div>

</div>
