<div class="main">

  <!-- ✅ HEADER -->
  <div class="top-bar">
    <h2>Students</h2>
    <button class="add-btn" (click)="openModal()">+ Add Student</button>
  </div>

  <!-- ✅ TABLE -->
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let s of students">

        <td>{{ s.name }}</td>

        <td>{{ s.email }}</td>

        <td>{{ s.status || 'active' }}</td>

        <td>
          <button (click)="deleteStudent(s._id)">Delete</button>
        </td>

      </tr>
    </tbody>
  </table>

</div>

<!-- ✅ MODAL -->
<div class="modal" *ngIf="showModal">

  <div class="modal-box">

    <h3>Add Student</h3>

    <div class="form">

      <input [(ngModel)]="newStudent.name" placeholder="Full Name" />

      <input [(ngModel)]="newStudent.email" placeholder="Email" />

      <input type="password" [(ngModel)]="newStudent.password" placeholder="Password" />

    </div>

    <div class="actions">
      <button class="save" (click)="createStudent()">Save</button>
      <button class="cancel" (click)="closeModal()">Cancel</button>
    </div>

  </div>

</div>
