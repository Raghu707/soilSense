<div class="main">

  <!-- HEADER -->

  <div class="top-bar">

    <div class="header-info">

      <h2>Supervisors</h2>

      <p class="subtitle">
        Manage student accounts
      </p>

    </div>

    <button
      class="add-btn"
      (click)="openModal()">

      ➕ Add Student

    </button>

  </div>

  <!-- TABLE -->

  <div class="table-container">

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>Name</th>
            <th>Email</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let s of students">

            <td>

              <div class="user-cell">

                <div class="avatar">

                  {{ s.name?.charAt(0).toUpperCase() }}

                </div>

                <span>

                  {{ s.name }}

                </span>

              </div>

            </td>

            <td>

              {{ s.email }}

            </td>

            <td>

              <button
                class="delete-btn"
                (click)="deleteStudent(s._id)">

                🗑 Delete

              </button>

            </td>

          </tr>

          <tr *ngIf="students.length === 0">

            <td
              colspan="3"
              class="no-data">

              No supervisors available

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

<!-- MODAL -->

<div
  class="modal"
  *ngIf="showModal">

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-icon">
        👨‍🏫
      </div>

      <h3>Add Supervisor</h3>

      <p>
        Create a new supervisor account
      </p>

    </div>

    <div class="form">

      <input
        [(ngModel)]="newStudent.name"
        placeholder="Full Name">

      <input
        [(ngModel)]="newStudent.email"
        placeholder="Email Address">

      <input
        type="password"
        [(ngModel)]="newStudent.password"
        placeholder="Password">

    </div>

    <div class="actions">

      <button
        class="cancel"
        (click)="closeModal()">

        Cancel

      </button>

      <button
        class="save"
        (click)="createStudent()">

        ✅ Save

      </button>

    </div>

  </div>

</div>
