<div class="main">

  <!-- ✅ HEADER -->
  <div class="top-bar">
    <div>
      <h2>👨‍💼 Student View</h2>
      <p class="subtitle">Manage all student</p>
    </div>

    <button class="add-btn" (click)="openModal()">
      + Add Supervisor
    </button>
  </div>

  <!-- ✅ TABLE CARD -->
  <div class="table-container">

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let s of students">

          <!-- ✅ NAME WITH AVATAR -->
          <td>
            <div class="user-cell">
              <div class="avatar">
                {{ s.name?.charAt(0) }}
              </div>
              <span>{{ s.name }}</span>
            </div>
          </td>

          <td>{{ s.email }}</td>

          <td>
            <button class="delete-btn" (click)="deleteStudent(s._id)">
              🗑 Delete
            </button>
          </td>

        </tr>

        <!-- ✅ EMPTY STATE -->
        <tr *ngIf="students.length === 0">
          <td colspan="3" class="no-data">
            No supervisors available
          </td>
        </tr>

      </tbody>
    </table>

  </div>

</div>

<!-- ✅ MODAL -->
<div class="modal" *ngIf="showModal">

  <div class="modal-box">

    <h3>➕ Add Supervisor</h3>

    <div class="form">

      <input
        [(ngModel)]="newStudent.name"
        placeholder="Full Name"
      />

      <input
        [(ngModel)]="newStudent.email"
        placeholder="Email"
      />

      <input
        type="password"
        [(ngModel)]="newStudent.password"
        placeholder="Password"
      />

    </div>

    <div class="actions">
      <button class="save" (click)="createStudent()">✅ Save</button>
      <button class="cancel" (click)="closeModal()">Cancel</button>
    </div>

  </div>

</div>
